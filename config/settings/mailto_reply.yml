mailto_reply:
  mailto_reply_enabled:
    default: false
    client: true
    description: "Enable mailto reply functionality"
  mailto_reply_address:
    default: ""
    client: true
    description: "Email address for mailing list replies"
  mailto_reply_include_quoted_text:
    default: true
    client: true
    description: "Include quoted original message in email body"
  mailto_reply_include_headers:
    default: true
    client: true
    description: "Include email threading headers"
